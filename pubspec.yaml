name: bentos_driver_sdk
description: BentOS Driver SDK — build CUSE/FUSE drivers in pure Dart. No libfuse dependency. Implements the BentOS wire protocol (length-prefixed protobuf over Unix domain sockets) with four I/O pattern frameworks.
version: 0.1.0
repository: https://github.com/cafe01/bentos-driver-sdk-dart
homepage: https://github.com/cafe01/bentos-driver-sdk-dart

topics:
  - agent
  - ai
  - driver
  - bentos

environment:
  sdk: ^3.8.0

dependencies:
  async: ^2.11.0
  fixnum: ^1.1.0
  logging: ^1.3.0
  protobuf: ^6.0.0
  stream_channel: ^2.1.0

dev_dependencies:
  http: ^1.2.0
  lints: ^6.0.0
  test: ^1.24.0
